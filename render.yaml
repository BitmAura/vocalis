services:
  - type: web
    name: vocalis-ai-receptionist
    env: node
    plan: free
    buildCommand: npm install && (pip install -r requirements.txt || true)
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
